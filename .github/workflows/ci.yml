name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Run tests
        run: pytest

  docker:
    name: Build and smoke-test Docker image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t gaia-agent .

      - name: Start container
        run: docker run -d --name api -p 8000:8000 -e GEMINI_API_KEY=dummy gaia-agent

      - name: Check /health responds
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/health; then
              echo
              echo "API is up"
              exit 0
            fi
            sleep 2
          done
          echo "API did not become healthy"
          docker logs api
          exit 1